name: Security Audit

on: [pull_request, push]

jobs:
  audit:
    name: "Scanning for Vulnerabilities"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: npm audit
        run: npm audit --production --audit-level=moderate
        continue-on-error: false # Falla si hay vulnerabilidades críticas/altas
      
      - name: Check secrets in code
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false # Previene push de llaves privadas/API keys
      
      - name: Lint for security patterns
        run: npm run lint
